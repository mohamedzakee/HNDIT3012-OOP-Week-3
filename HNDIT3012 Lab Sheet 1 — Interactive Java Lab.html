<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HNDIT3012 Lab Sheet 1 — Interactive Java Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f3ec; --card:#fffdf8; --ink:#1c2230; --muted:#5d6878; --line:#e3ddd0;
  --accent:#0d6b6b; --accent-soft:#dcefed; --amber:#c9741c; --amber-soft:#fbecd9;
  --good:#2e7d4f; --good-soft:#e1f2e7; --bad:#b23b3b; --bad-soft:#f8e1e1;
  --term:#141a21; --term-ink:#d6dee6; --term-prompt:#7fd1ae; --term-in:#f2b56b; --term-dim:#7d8a97;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#12161c; --card:#1a2028; --ink:#e6e9ee; --muted:#9aa5b3; --line:#2b333e;
    --accent:#4fb7b0; --accent-soft:#163a3a; --amber:#e9a157; --amber-soft:#3a2a17;
    --good:#5cc489; --good-soft:#173324; --bad:#e57373; --bad-soft:#3a1c1c; --term:#0b0f14; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--mono)}
a{color:var(--accent)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--paper)}
main{padding:28px clamp(16px,4vw,48px) 64px;max-width:1040px;width:100%}
.brand{display:flex;flex-direction:column;gap:2px;margin:0 6px 18px;cursor:pointer}
.brand .code{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:600}
.brand .name{font-weight:700;font-size:17px;line-height:1.25}
.progress{margin:0 6px 18px}
.progress .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.progress .fill{height:100%;background:var(--accent);width:0;transition:width .4s}
.progress .lbl{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:28px 1fr 18px;align-items:center;gap:8px;width:100%;padding:8px 8px;border-radius:8px;cursor:pointer}
.nav button:hover{background:var(--card)}
.nav button.active{background:var(--card);box-shadow:inset 3px 0 0 var(--accent)}
.nav .num{font-family:var(--mono);font-size:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.nav button.done .num{background:var(--good);border-color:var(--good);color:#fff}
.nav .t{font-size:14px;line-height:1.3}
.nav .t small{display:block;color:var(--muted);font-size:12px}
.nav .chk{color:var(--good);font-size:14px}
.side-foot{margin:18px 6px 0;font-size:12px;color:var(--muted)}
.menu-btn{display:none}

/* ---------- home ---------- */
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:600;text-transform:uppercase}
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:6px 0 10px;letter-spacing:-.01em}
h2{font-size:20px;margin:28px 0 10px}
h3{font-size:16px;margin:18px 0 8px}
.lead{color:var(--muted);max-width:68ch;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.tcard{cursor:pointer;transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:6px}
.tcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.tcard .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tcard .tt{font-weight:600;line-height:1.3}
.tcard.done{border-color:var(--good)}
.tcard.done .n::after{content:"  ✓ done";color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.howto .card b{display:block;margin-bottom:4px}

/* ---------- task ---------- */
.task-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0 20px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.active{color:var(--ink);border-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.statement{font-size:17px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.hint{background:var(--amber-soft);border-radius:10px;padding:12px 14px;margin:8px 0;animation:fade .3s}
.hint b{color:var(--amber)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.note{font-size:13.5px;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}

/* terminal */
.term{background:var(--term);color:var(--term-ink);border-radius:10px;font-family:var(--mono);font-size:13.5px;overflow:hidden;margin-top:14px}
.term .bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(255,255,255,.04);font-size:11.5px;color:var(--term-dim)}
.term .bar i{width:10px;height:10px;border-radius:50%;background:#3a434e;display:inline-block}
.term .bar span{margin-left:8px}
.term pre{margin:0;padding:12px 14px 14px;white-space:pre-wrap;word-break:break-word;min-height:56px;line-height:1.55}
.term .in{color:var(--term-in)}
.term .p{color:var(--term-prompt)}
.term .dim{color:var(--term-dim)}
.term .err{color:#ff8a8a}

/* code */
.codewrap{position:relative;background:var(--term);border-radius:10px;overflow:hidden}
.codewrap pre{margin:0;padding:14px 16px;overflow:auto;font-size:13px;line-height:1.6;color:#d6dee6;counter-reset:ln}
.codewrap .ln{display:block;padding-left:0}
.codewrap .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:2.2em;margin-right:12px;text-align:right;color:#56616d;user-select:none}
.codewrap .ln.hit{background:rgba(242,181,107,.16);box-shadow:inset 3px 0 0 #f2b56b}
.codewrap .copy{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#d6dee6;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.k{color:#c792ea}.s{color:#c3e88d}.c{color:#6f7e8c;font-style:italic}.nn{color:#f78c6c}.ty{color:#82aaff}
.gate{text-align:center;padding:34px 20px;border:1px dashed var(--line);border-radius:12px;background:var(--card)}
.gate p{color:var(--muted);margin:0 0 14px}

/* tables */
table.t{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
table.t td.mono{font-family:var(--mono)}
table.t tr.cur td{background:var(--amber-soft)}
table.t tr.new td{animation:fade .35s}

/* diamond */
.diamond{font-family:var(--mono);font-size:18px;line-height:1.25;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;white-space:pre;overflow:auto;text-align:left}
.diamond .sp{color:var(--muted);opacity:.5}
.diamond .st{color:var(--accent);font-weight:600}

/* stack */
.stack{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.frame{font-family:var(--mono);font-size:13.5px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);animation:fade .3s}
.frame .ret{float:right;font-weight:600}
.frame.t .ret{color:var(--good)} .frame.f .ret{color:var(--bad)}
.frame em{font-style:normal;color:var(--muted)}
.verdict{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:600}
.verdict.y{background:var(--good-soft);color:var(--good)} .verdict.n{background:var(--bad-soft);color:var(--bad)}

/* matrix */
.mats{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.mat{display:inline-grid;gap:4px;padding:8px 10px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:6px}
.mat input,.mat .cell{width:52px;height:38px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--card);font-family:var(--mono);font-size:14px;display:grid;place-items:center}
.mat .cell{cursor:default}
.mat .cell.res{background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer}
.mat .hl{outline:2px solid var(--amber);background:var(--amber-soft)!important}
.mat .sel{outline:2px solid var(--accent)}
.op{font-size:22px;color:var(--muted);font-family:var(--mono)}
.mlabel{font-size:12px;color:var(--muted);text-align:center;margin-top:4px;font-family:var(--mono)}
.calc{margin-top:12px;font-family:var(--mono);font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}

/* file */
.filebox{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.filebox .fh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--muted)}
.filebox pre{margin:0;padding:12px;font-family:var(--mono);font-size:13.5px;min-height:90px;white-space:pre-wrap}

/* sort */
.bars{display:flex;align-items:flex-end;gap:6px;height:210px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:12px}
.barc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.barc .b{width:100%;max-width:56px;background:var(--line);border-radius:6px 6px 2px 2px;transition:height .3s,background .2s}
.barc .v{font-family:var(--mono);font-size:12.5px}
.barc.cmp .b{background:var(--amber)}
.barc.swp .b{background:var(--bad)}
.barc.ok .b{background:var(--good)}
.stats{display:flex;gap:18px;font-size:13.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.stats b{color:var(--ink);font-family:var(--mono)}
.msg{margin-top:8px;font-size:14px;min-height:22px}

/* quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.q .qt{font-weight:600;margin-bottom:10px}
.q pre{background:var(--term);color:#d6dee6;padding:10px 12px;border-radius:8px;font-size:13px;overflow:auto;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{all:unset;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14.5px}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:500}
.opts button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opts button:disabled{cursor:default}
.why{margin-top:10px;font-size:14px;color:var(--muted);animation:fade .3s}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.pager{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
.code-lines{margin-top:12px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:280px;z-index:20;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{transform:none}
  .menu-btn{display:inline-flex;position:sticky;top:10px;z-index:10;margin-bottom:10px}
  .two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand" onclick="go('')">
      <span class="code">HNDIT3012 · OOP</span>
      <span class="name">Lab Sheet 1<br>Java Fundamentals</span>
    </div>
    <div class="progress">
      <div class="bar"><div class="fill" id="pfill"></div></div>
      <div class="lbl"><span id="plabel">0 of 10 complete</span><span id="ppct">0%</span></div>
    </div>
    <ul class="nav" id="nav"></ul>
    <div class="side-foot">Companion to the Week 3 Control Flow study guide. Solutions verified on Java 21.<br><br><button class="btn small" onclick="resetProgress()">Reset progress</button></div>
  </aside>
  <main id="main"></main>
</div>

<script>
const JAVA = {"Lab10_ArrayMethods": "import java.util.Scanner;\n\npublic class Lab10_ArrayMethods {\n    static Scanner sc = new Scanner(System.in);\n\n    // a. Read numbers into the array\n    static void read(int a[]) {\n        System.out.println(\"Enter \" + a.length + \" numbers:\");\n        for (int i = 0; i < a.length; i++)\n            a[i] = sc.nextInt();\n    }\n\n    // b. Sort the array in ascending order (bubble sort)\n    static void sort(int a[]) {\n        for (int i = 0; i < a.length - 1; i++) {\n            for (int j = 0; j < a.length - 1 - i; j++) {\n                if (a[j] > a[j + 1]) {\n                    int temp = a[j];\n                    a[j] = a[j + 1];\n                    a[j + 1] = temp;\n                }\n            }\n        }\n    }\n\n    // c. Print the array\n    static void print(int a[]) {\n        for (int i = 0; i < a.length; i++)\n            System.out.print(a[i] + \" \");\n        System.out.println();\n    }\n\n    public static void main(String[] args) {\n        System.out.print(\"How many numbers? \");\n        int n = sc.nextInt();\n        int[] numbers = new int[n];\n        read(numbers);\n        sort(numbers);\n        System.out.print(\"Sorted: \");\n        print(numbers);\n    }\n}\n", "Lab1_TempConverter": "import java.util.Scanner;\n\npublic class Lab1_TempConverter {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Enter temperature in Fahrenheit: \");\n        double f = sc.nextDouble();\n        double c = (f - 32) * 5 / 9;\n        System.out.printf(\"%.1f F = %.2f C%n\", f, c);\n        sc.close();\n    }\n}\n", "Lab2_DigitSum": "import java.util.Scanner;\n\npublic class Lab2_DigitSum {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Enter an integer between 0 and 1000: \");\n        int n = sc.nextInt();\n        if (n < 0 || n > 1000) {\n            System.out.println(\"Invalid input. Number must be 0 to 1000.\");\n        } else {\n            int original = n;\n            int sum = 0;\n            while (n > 0) {\n                sum += n % 10;   // take the last digit\n                n = n / 10;      // remove the last digit\n            }\n            System.out.println(\"Sum of digits of \" + original + \" = \" + sum);\n        }\n        sc.close();\n    }\n}\n", "Lab3_Greatest": "import java.util.Scanner;\n\npublic class Lab3_Greatest {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Enter first number: \");\n        double a = sc.nextDouble();\n        System.out.print(\"Enter second number: \");\n        double b = sc.nextDouble();\n        System.out.print(\"Enter third number: \");\n        double c = sc.nextDouble();\n\n        double greatest;\n        if (a >= b && a >= c) {\n            greatest = a;\n        } else if (b >= a && b >= c) {\n            greatest = b;\n        } else {\n            greatest = c;\n        }\n        System.out.println(\"The greatest number is: \" + greatest);\n        sc.close();\n    }\n}\n", "Lab4_DaysInMonth": "import java.util.Scanner;\n\npublic class Lab4_DaysInMonth {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Enter month number (1-12): \");\n        int month = sc.nextInt();\n        System.out.print(\"Enter year: \");\n        int year = sc.nextInt();\n\n        int days;\n        switch (month) {\n            case 1: case 3: case 5: case 7: case 8: case 10: case 12:\n                days = 31;\n                break;\n            case 4: case 6: case 9: case 11:\n                days = 30;\n                break;\n            case 2:\n                boolean leap = (year % 4 == 0 && year % 100 != 0) || (year % 400 == 0);\n                days = leap ? 29 : 28;\n                break;\n            default:\n                days = -1;\n        }\n\n        if (days == -1)\n            System.out.println(\"Invalid month\");\n        else\n            System.out.println(\"Month \" + month + \" of \" + year + \" has \" + days + \" days\");\n        sc.close();\n    }\n}\n", "Lab5_Diamond": "import java.util.Scanner;\n\npublic class Lab5_Diamond {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Input number of rows (half of the diamond): \");\n        int n = sc.nextInt();\n\n        // Upper half (including the middle row)\n        for (int i = 1; i <= n; i++) {\n            for (int s = 1; s <= n - i; s++) System.out.print(\" \");\n            for (int k = 1; k <= 2 * i - 1; k++) System.out.print(\"*\");\n            System.out.println();\n        }\n        // Lower half\n        for (int i = n - 1; i >= 1; i--) {\n            for (int s = 1; s <= n - i; s++) System.out.print(\" \");\n            for (int k = 1; k <= 2 * i - 1; k++) System.out.print(\"*\");\n            System.out.println();\n        }\n        sc.close();\n    }\n}\n", "Lab6_Palindrome": "import java.util.Scanner;\n\npublic class Lab6_Palindrome {\n\n    // Recursive method: compares first and last characters, then the inside\n    static boolean isPalindrome(String s) {\n        if (s.length() <= 1)                      // base case\n            return true;\n        if (s.charAt(0) != s.charAt(s.length() - 1))\n            return false;\n        return isPalindrome(s.substring(1, s.length() - 1)); // recursive case\n    }\n\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Enter a string: \");\n        String input = sc.nextLine();\n        String cleaned = input.toLowerCase().replaceAll(\"[^a-z0-9]\", \"\");\n        if (isPalindrome(cleaned))\n            System.out.println(\"\\\"\" + input + \"\\\" is a palindrome\");\n        else\n            System.out.println(\"\\\"\" + input + \"\\\" is not a palindrome\");\n        sc.close();\n    }\n}\n", "Lab7_MatrixAdd": "import java.util.Scanner;\n\npublic class Lab7_MatrixAdd {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Enter number of rows: \");\n        int r = sc.nextInt();\n        System.out.print(\"Enter number of columns: \");\n        int c = sc.nextInt();\n\n        int[][] a = new int[r][c];\n        int[][] b = new int[r][c];\n        int[][] sum = new int[r][c];\n\n        System.out.println(\"Enter elements of matrix A:\");\n        for (int i = 0; i < r; i++)\n            for (int j = 0; j < c; j++)\n                a[i][j] = sc.nextInt();\n\n        System.out.println(\"Enter elements of matrix B:\");\n        for (int i = 0; i < r; i++)\n            for (int j = 0; j < c; j++)\n                b[i][j] = sc.nextInt();\n\n        for (int i = 0; i < r; i++)\n            for (int j = 0; j < c; j++)\n                sum[i][j] = a[i][j] + b[i][j];\n\n        System.out.println(\"A + B =\");\n        for (int i = 0; i < r; i++) {\n            for (int j = 0; j < c; j++)\n                System.out.print(sum[i][j] + \"\\t\");\n            System.out.println();\n        }\n        sc.close();\n    }\n}\n", "Lab8_MatrixMultiply": "import java.util.Scanner;\n\npublic class Lab8_MatrixMultiply {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Rows and columns of A: \");\n        int r1 = sc.nextInt(), c1 = sc.nextInt();\n        System.out.print(\"Rows and columns of B: \");\n        int r2 = sc.nextInt(), c2 = sc.nextInt();\n\n        if (c1 != r2) {\n            System.out.println(\"Cannot multiply: columns of A must equal rows of B.\");\n            return;\n        }\n\n        int[][] a = new int[r1][c1];\n        int[][] b = new int[r2][c2];\n        int[][] p = new int[r1][c2];\n\n        System.out.println(\"Enter elements /* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

const KW = new Set('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static super switch synchronized this throw throws transient try void volatile while true false null var'.split(' '));
function hlJava(code){
  const re = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*")|('(?:\\.|[^'\\\n])')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1] || m[2]) out += `<span class="c">${t}</span>`;
    else if (m[3] || m[4]) out += `<span class="s">${t}</span>`;
    else if (m[5]) out += `<span class="nn">${t}</span>`;
    else if (KW.has(m[0])) out += `<span class="k">${t}</span>`;
    else if (/^[A-Z]/.test(m[0])) out += `<span class="ty">${t}</span>`;
    else out += t;
    last = re.lastIndex;
  }
  out += esc(code.slice(last));
  return out.split('\n').map(l => `<span class="ln">${l || ' '}</span>`).join('');
}
function codeBlock(code, {copy = true, hits = []} = {}){
  const el = h(`<div class="codewrap"><pre>${hlJava(code)}</pre>${copy ? '<button class="copy">Copy</button>' : ''}</div>`);
  hits.forEach(i => { const ln = el.querySelectorAll('.ln')[i]; if (ln) ln.classList.add('hit'); });
  if (copy) $('.copy', el).onclick = async (e) => {
    try { await navigator.clipboard.writeText(code); e.target.textContent = 'Copied'; }
    catch { e.target.textContent = 'Select & copy manually'; }
    setTimeout(() => e.target.textContent = 'Copy', 1600);
  };
  return el;
}
function setHits(wrap, hits){
  wrap.querySelectorAll('.ln').forEach((l, i) => l.classList.toggle('hit', hits.includes(i)));
}
/* terminal: lines is array of [type,text]; types: p (program print), in (user input), err, dim */
function term(title = 'java'){
  const el = h(`<div class="term"><div class="bar"><i></i><i></i><i></i><span>${esc(title)}</span></div><pre></pre></div>`);
  el.set = (parts) => { $('pre', el).innerHTML = parts.map(([t, s]) => t === 'p' ? esc(s) : `<span class="${t}">${esc(s)}</span>`).join(''); };
  return el;
}
const fmt = (x) => Number.isInteger(x) ? x.toFixed(1) : String(+x.toFixed(10));

      $('#bars', root).innerHTML = s.a.map((v, idx) => {
        let cls = ''; if (idx >= n - s.sorted) cls = 'ok'; if (s.hi.includes(idx)) cls = s.kind;
        return `<div class="barc ${cls}"><div class="b" style="height:${Math.max(6, Math.abs(v)/max*160)}px"></div><div class="v">${v}</div></div>`;
      }).join('');
      $('#msg', root).textContent = s.msg; $('#si', root).textContent = s.i; $('#sc', root).textContent = s.cmp; $('#ss', root).textContent = s.sw;
      if (s.end) t.set([['p','How many numbers? '],['in', n + '\n'],['p', `Enter ${n} numbers:\n`],['in', input.join(' ') + '\n'],['p', 'Sorted: ' + s.a.join(' ') + ' \n']]);
    };
    const parse = () => $('#nums', root).value.split(/[\s,]+/).filter(Boolean).map(Number).filter(x => !isNaN(x)).slice(0, 12);
    const stop = () => { clearInterval(timer); timer = null; $('#play', root).textContent = 'Play'; };
    $('#load', root).onclick = () => { stop(); const a = parse(); if (a.length) prep(a); };
    $('#rnd', root).onclick = () => { stop(); const a = Array.from({length: 7}, () => Math.floor(Math.random()*90) + 5); $('#nums', root).value = a.join(' '); prep(a); };
    $('#step', root).onclick = () => { stop(); if (k < steps.length - 1){ k++; draw(); } };
    $('#play', root).onclick = () => {
      if (timer) return stop();
      if (k >= steps.length - 1){ k = 0; }
      $('#play', root).textContent = 'Pause';
      timer = setInterval(() => { if (k >= steps.length - 1) return stop(); k++; draw(); }, 550);
    };
    $('#nums', root).onkeydown = e => { if (e.key === 'Enter') $('#load', root).click(); };
    prep(parse());
  },
  quiz: [
    { q: 'Why can <code>sort(int a[])</code> be <code>void</code> and still change the array in <code>main</code>?', o: ['Java copies the array back automatically', 'The method receives a reference to the same array object', 'Because it is static', 'It cannot — it must return the array'], a: 1, why: 'The parameter refers to the same array in memory, so swaps inside the method are seen by the caller.' },
    { q: 'How many comparisons does this bubble sort make for 5 numbers?', o: ['5', '10', '20', '25'], a: 1, why: 'Passes compare 4 + 3 + 2 + 1 = 10 pairs, i.e. n(n − 1)/2.' }
  ]
}
];

/* ---------------- rendering ---------------- */
function renderNav(){
  const nav = $('#nav'); const cur = currentIdx();
  nav.innerHTML = '';
  TASKS.forEach((tk, i) => {
    const li = h(`<li><button class="${i === cur ? 'active' : ''} ${done.has(i) ? 'done' : ''}"><span class="num">${done.has(i) ? '✓' : i + 1}</span><span class="t">${esc(tk.title)}<small>${esc(tk.short)}</small></span><span class="chk"></span></button></li>`);
    $('button', li).onclick = () => go('task-' + (i + 1));
    nav.append(li);
  });
  const pct = Math.round(done.size / TASKS.length * 100);
  $('#pfill').style.width = pct + '%'; $('#plabel').textContent = `${done.size} of ${TASKS.length} complete`; $('#ppct').textContent = pct + '%';
}
function currentIdx(){ const m = location.hash.match(/^#task-(\d+)$/); return m ? +m[1] - 1 : -1; }
function go(hash){ if (hash) location.hash = hash; else { history.replaceState(null, '', location.pathname + location.search); route(); } $('#side').classList.remove('open'); }

function renderHome(){
  const main = $('#main'); main.innerHTML = '';
  main.append(h(`<button class="btn small menu-btn" onclick="document.getElementById('side').classList.add('open')">☰ Tasks</button>`));
  main.append(h(`<div><div class="eyebrow">HNDIT3012 · Object Oriented Programming</div>
    <h1>Lab Sheet 1 — Java Programming Fundamentals</h1>
    <p class="lead">Ten hands-on tasks that put Week 3's control flow statements to work. For each task: read the problem, reveal hints one at a time, experiment in the live simulator, compare with the verified solution, then check yourself with a short quiz.</p>
    <div class="howto">
      <div class="card"><b>1 · Problem</b><span class="note">Statement, approach and progressive hints.</span></div>
      <div class="card"><b>2 · Try it</b><span class="note">Run the logic with your own input and watch each step.</span></div>
      <div class="card"><b>3 · Solution</b><span class="note">Complete Java code, compiled and tested. Copy it into your IDE.</span></div>
      <div class="card"><b>4 · Quiz</b><span class="note">Answer both questions correctly to mark the task complete.</span></div>
    </div></div>`));
  const g = h('<div class="grid"></div>');
  TASKS.forEach((tk, i) => {
    const c = h(`<div class="card tcard ${done.has(i) ? 'done' : ''}"><span class="n">TASK ${String(i+1).padStart(2,'0')}</span><span class="tt">${esc(tk.title)}</span><div class="chips">${tk.concepts.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div></div>`);
    c.onclick = () => go('task-' + (i + 1)); g.append(c);
  });
  main.append(g);
}

const tabState = {};
function renderTask(i){
  const tk = TASKS[i], main = $('#main'); main.innerHTML = '';
  main.append(h(`<button class="btn small menu-btn" onclick="document.getElementById('side').classList.add('open')">☰ Tasks</button>`));
  main.append(h(`<div class="task-head"><div><div class="eyebrow">Task ${i + 1} of ${TASKS.length}</div><h1>${esc(tk.title)}</h1><div class="chips">${tk.concepts.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div></div></div>`));
  const tabs = h(`<div class="tabs"><button data-t="problem">Problem</button><button data-t="try">Try it</button><button data-t="code">Solution</button><button data-t="quiz">Quiz</button></div>`);
  const body = h('<div></div>');
  main.append(tabs, body);
  const show = (name) => {
    tabState[i] = name;
    tabs.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.t === name));
    body.innerHTML = '';
    if (name === 'problem') renderProblem(tk, body, show);
    if (name === 'try') tk.tryit(body);
    if (name === 'code') renderCode(tk, i, body);
    if (name === 'quiz') renderQuiz(tk, i, body);
  };
  tabs.querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.t));
  show(tabState[i] || 'problem');
  const pager = h(`<div class="pager"><button class="btn" ${i === 0 ? 'disabled' : ''}>← Previous task</button><button class="btn" ${i === TASKS.length - 1 ? 'disabled' : ''}>Next task →</button></div>`);
  const [prev, next] = pager.querySelectorAll('button');
  prev.onclick = () => go('task-' + i); next.onclick = () => go('task-' + (i + 2));
  main.append(pager);
  window.scrollTo(0, 0);
}
function renderProblem(tk, body, show){
  body.append(h(`<div class="statement">${tk.statement}</div>`));
  body.append(h(`<h3>Approach</h3>`), h(`<p>${esc(tk.approach)}</p>`));
  body.append(h(`<h3>Hints</h3>`));
  const hb = h('<div></div>'); body.append(hb);
  let n = 0;
  const btn = h(`<button class="btn">Show hint 1 of ${tk.hints.length}</button>`);
  btn.onclick = () => { hb.append(h(`<div class="hint"><b>Hint ${n + 1}.</b> ${tk.hints[n]}</div>`)); n++; if (n >= tk.hints.length) btn.remove(); else btn.textContent = `Show hint ${n + 1} of ${tk.hints.length}`; };
  body.append(btn);
  const go2 = h(`<div class="row" style="margin-top:22px"><button class="btn primary">Try it in the simulator →</button></div>`);
  $('button', go2).onclick = () => show('try'); body.append(go2);
}
const revealed = new Set();
function renderCode(tk, i, body){
  const code = JAVA[tk.java];
  const draw = () => {
    body.innerHTML = '';
    body.append(h(`<p class="note">File name: <code>${tk.java}.java</code> — the class name must match the file name.</p>`));
    body.append(codeBlock(code));
  };
  if (revealed.has(i)) return draw();
  const g = h(`<div class="gate"><p>Have you tried writing it yourself first? Looking too early makes the lab much less useful.</p><button class="btn primary">I've tried — show the solution</button></div>`);
  $('button', g).onclick = () => { revealed.add(i); draw(); };
  body.append(g);
}
function renderQuiz(tk, i, body){
  const state = tk.quiz.map(() => null);
  tk.quiz.forEach((q, qi) => {
    const el = h(`<div class="q"><div class="qt">${qi + 1}. ${q.q}</div><div class="opts"></div></div>`);
    q.o.forEach((opt, oi) => {
      const b = h(`<button>${esc(opt)}</button>`);
      b.onclick = () => {
        el.querySelectorAll('.opts button').forEach((x, xi) => { x.disabled = true; if (xi === q.a) x.classList.add('right'); });
        if (oi !== q.a) b.classList.add('wrong');
        state[qi] = oi === q.a;
        el.append(h(`<div class="why">${oi === q.a ? '<b style="color:var(--good)">Correct.</b> ' : '<b style="color:var(--bad)">Not quite.</b> '}${q.why}</div>`));
        check();
      };
      $('.opts', el).append(b);
    });
    body.append(el);
  });
  const bar = h(`<div class="done-bar"><span id="qs"></span><div class="row"><button class="btn" id="retry">Retry quiz</button><button class="btn primary" id="mark"></button></div></div>`);
  body.append(bar);
  const check = () => {
    const answered = state.filter(x => x !== null).length, right = state.filter(Boolean).length;
    $('#qs', bar).textContent = answered < state.length ? `${answered} of ${state.length} answered` : `${right} of ${state.length} correct`;
    if (answered === state.length && right === state.length && !done.has(i)){ done.add(i); saveDone(); }
    $('#mark', bar).textContent = done.has(i) ? '✓ Completed — mark as not done' : 'Mark task complete';
  };
  $('#retry', bar).onclick = () => { body.innerHTML = ''; renderQuiz(tk, i, body); };
  $('#mark', bar).onclick = () => { done.has(i) ? done.delete(i) : done.add(i); saveDone(); check(); };
  check();
}

function route(){
  const i = currentIdx();
  if (i >= 0 && i < TASKS.length) renderTask(i); else renderHome();
  renderNav();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
